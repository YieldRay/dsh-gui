name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One rolling snapshot release, overwritten on each push to main.
env:
  RELEASE_TAG: v0.0.0
  # Keep the Deno dir (deps + downloaded desktop backends) in a cacheable path.
  DENO_DIR: ${{ github.workspace }}/.deno-dir

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            output: dist/DeepSeek.dmg
            artifact: DeepSeek-macos-arm64.dmg
          - os: windows-latest
            output: dist/DeepSeek.msi
            artifact: DeepSeek-windows-x64.msi
          - os: ubuntu-latest
            output: dist/DeepSeek.AppImage
            artifact: DeepSeek-linux-x64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache Deno dir (deps + desktop backends)
        uses: actions/cache@v6
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      # WebView backend on Linux renders via WebKitGTK, which needs its dev libs.
      - name: Install Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Test
        run: deno task test

      - name: Build desktop bundle
        run: deno desktop -A --unstable-raw-imports --output ${{ matrix.output }} main.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling snapshot release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Snapshot (${{ env.RELEASE_TAG }})
          body: |
            Rolling snapshot build from `main` @ ${{ github.sha }}.
            This release is overwritten on every push to `main`.
          prerelease: true
          # Move the tag to this commit and replace the release's assets each run.
          fail_on_unmatched_files: true
          files: artifacts/**/*
